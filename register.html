<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — AnimeBox</title>
    <meta name="description" content="Регистрация в AnimeBox.">
    <link rel="icon" href="source/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="source/css/auth/register.css">
</head>
<body>
    <div class="load_box" aria-hidden="true">
        <div class="logo_bg">
            <img src="source/img/auth/logo_load.png" alt="">
        </div>
        <div class="load_bg"></div>
    </div>

    <header>
        <div class="header">
            <div class="logo">
                <a href="welcome.html"><img src="source/img/auth/logo.png" alt="AnimeBox — на стартовую"></a>
            </div>
        </div>
    </header>

    <main id="content">

        <section class="register">
            <form action="main.html" class="reg auth-form" novalidate aria-labelledby="formTitle">
                <h1 class="title" id="formTitle">Регистрация</h1>
                <label for="regNick">Никнейм</label>
                <div class="input-group">
                    <img class="nick_icon" src="source/img/auth/nicname.png" alt="">
                    <input id="regNick" name="regNick" placeholder="Введите никнейм" type="text" autocomplete="username" required minlength="3" aria-describedby="regNickError">
                </div>
                <p class="field-error" id="regNickError" aria-live="polite"></p>
                <label for="regEmail">Email</label>
                <div class="input-group">
                    <img class="email_icon" src="source/img/auth/email.png" alt="">
                    <input id="regEmail" name="regEmail" placeholder="Введите email" type="email" autocomplete="email" required inputmode="email" aria-describedby="regEmailError">
                </div>
                <p class="field-error" id="regEmailError" aria-live="polite"></p>
                <label for="regPass">Пароль</label>
                <div class="input-group">
                    <img class="password_icon" src="source/img/auth/password.png" alt="">
                    <input id="regPass" name="regPass" placeholder="Не менее 6 символов" type="password" autocomplete="new-password" required minlength="6" aria-describedby="regPassError">
                    <button type="button" class="toggle-pass" aria-pressed="false">показать</button>
                </div>
                <p class="field-error" id="regPassError" aria-live="polite"></p>
                <label for="regPass2">Повторите пароль</label>
                <div class="input-group">
                    <img class="password_icon" src="source/img/auth/password.png" alt="">
                    <input id="regPass2" name="regPass2" placeholder="Повторите пароль" type="password" autocomplete="new-password" required minlength="6" data-match="regPass" aria-describedby="regPass2Error">
                    <button type="button" class="toggle-pass" aria-pressed="false">показать</button>
                </div>
                <p class="field-error" id="regPass2Error" aria-live="polite"></p>

                <button type="submit" class="btn">Зарегистрироваться</button>
                <span>Вы уже с нами?<a href="login.html">Войти</a></span>
            </form>
        </section> 

        <section class="hero_reg" aria-hidden="true">
            <div class="hero_one_reg">
                <img src="source/img/welcome/hero1.png" alt="">
            </div>
            <div class="hero_two_reg">
                <img src="source/img/welcome/hero2.png" alt="">
            </div>
        </section>


    </main>

    <footer class="version">Beta version 0.1.0</footer>

<script src="source/js/auth.js"></script>
</body>
</html>
